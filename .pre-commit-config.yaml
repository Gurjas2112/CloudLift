repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, cloudlift/)
        entry: mypy
        language: system
        types: [python]
        files: ^cloudlift/
        pass_filenames: false
