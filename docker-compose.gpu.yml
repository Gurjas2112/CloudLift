# GPU override (NVIDIA Container Toolkit / Docker Desktop WSL2 GPU support required).
services:
  api:
    build: { context: ., dockerfile: docker/Dockerfile.gpu }
    image: cloudlift:gpu
    environment: [CLOUDLIFT_DEVICE=cuda, CLOUDLIFT_CONFIG=configs/demo.yaml]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  console:
    image: cloudlift:gpu
    environment: [CLOUDLIFT_DEVICE=cuda, CLOUDLIFT_CONFIG=configs/demo.yaml]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
