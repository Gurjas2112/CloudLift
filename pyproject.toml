[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudlift"
version = "0.1.0"
description = "Generative AI cloud removal and surface reconstruction for LISS-IV imagery (UnCRtainTS + SAR + temporal fusion)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
# torch / torchvision are installed separately from the PyTorch index (see README).
dependencies = [
    "numpy>=1.26,<3",
    "rasterio>=1.3.10",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "albumentations>=1.4",
    "opensimplex>=0.4.5",
    "lightning>=2.2",
    "torchmetrics>=1.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "gradio>=5.0",
]

[project.optional-dependencies]
cloudmask = ["omnicloudmask>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML"]

[project.scripts]
cloudlift = "cloudlift.cli:main"

[tool.setuptools.packages.find]
include = ["cloudlift*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["third_party", ".venv", "data", "cache", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["B008", "E501"]  # line length is enforced by `ruff format`

[tool.mypy]
python_version = "3.12"
strict = true
files = ["cloudlift"]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_subclassing_any = false
warn_return_any = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: requires CUDA",
    "slow: long-running (training smoke)",
]
filterwarnings = ["ignore::DeprecationWarning"]
